name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: echo "export const GH_REPO = '${{ github.repository }}'; export const BUILD = ${{ github.run_number }}; export const SHA = '${GITHUB_SHA::7}';" > repo.js
      - run: npm install --legacy-peer-deps
      - run: npx expo install --fix
      - run: node -e "const j=require('./app.json');j.expo.android.versionCode=${{ github.run_number }};require('fs').writeFileSync('app.json',JSON.stringify(j,null,2))"
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk ApexDrive.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ApexDrive ${{ github.run_number }}
          files: ApexDrive.apk
